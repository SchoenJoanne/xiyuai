      - name: 频率语义档 leaky 修干净（实跑真实 ensureTodaySchedule·target=0 闸开真零/闸关旧 leaky·映射4/2叠busyFactor·灰度闸默认关零变更）
        run: node scripts/proactive_freq_semantic_smoke.mjs

      - name: voice security（voice_style 受控枚举防注入入库·voice_speed clamp[0.5,2.0]·createCompanion roundtrip·迁移覆盖·确定性底透传·坏版本验红）
