name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 🔐 secret-scan(trufflehog) 全史扫描需完整历史（顺带满足 check:release tag 对账）
          fetch-tags: true   # check:release 的 tag↔package.json 对账需要 tags

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # photo_aspect_smoke 的转码卡口走真实 ImageMagick convert（与生产同链路）
      - name: 安装 ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: 语法检查 (node --check 全 src + scripts)
        run: find src scripts -name '*.mjs' -exec node --check {} \;

      # v1.21.2 (#263 事故后续)：no-const-assign 等运行时 TypeError 级问题在 CI 抓死。
      # 红色验证过：对 v1.20.1 坏版本跑能精确报出 'systemPrompt' is constant。
      - name: ESLint（真 bug 级规则，零风格审美）
        run: npm run lint

      - name: import 链 smoke
        run: npm run check:imports

      - name: 字段漂移检查
        run: npm run check:field-drift

      - name: 发布一致性（版本号↔tag↔README↔ROADMAP↔双语行数）
        run: npm run check:release

      - name: 发布前自检硬闸（forbidden/secret/prod-path/大文件/.env + 🔴表情包锁发布只发原创 #7）
        run: bash scripts/opensource_check.sh

      # 🔐 发布卫生门禁（#26·机械③·2026-07-03）：密钥硬扫。当前扫描零命中（key 只入 .env 不入库），
      #   本步=焊闸防未来密钥误入库。verified+unknown 命中即红。历史扫描依赖上方 fetch-depth:0。
      - name: 🔐 secret-scan（trufflehog·verified+unknown·发现即红）
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: neglect / 依恋 / reunion smoke
        run: node scripts/neglect_stage_smoke.mjs

      - name: 共建独特性 shaping smoke
        run: node scripts/shaping_smoke.mjs

      - name: 初恋特质 smoke
        run: node scripts/first_love_smoke.mjs

      - name: 人设导出字段对账（防白名单漂移）
        run: node scripts/persona_export_drift_check.mjs

      - name: 照片链路 issue#237 三连修复回归
        run: node scripts/photo_fix237_smoke.mjs

      - name: morning 重复早安修复回归
        run: node scripts/morning_dedup_smoke.mjs

      - name: morning 防穿帮盲区(今早已发过 proactive→不刚醒 + 跨天承接时间窗)
        run: node scripts/morning_already_up_smoke.mjs

      - name: 主动消息同义复读防护回归
        run: node scripts/proactive_dedup_smoke.mjs

      - name: proactive 失败不发兜底句（P2-A：reply 兜底句不泄漏进主动消息·治 BUG-P2"走神"·契约+caller接线双层·强制no-network）
        run: node scripts/proactive_fallback_smoke.mjs

      - name: proactive 冷开场语义+time-gap（P2-B：reply续话不变/proactive重新开口·两gap+第三布尔·禁续话语义·守PR-2红线·纯函数零网络）
        run: node scripts/proactive_coldopen_smoke.mjs

      - name: proactive 开场多样化（P1：开场由头跨会话记账·只存type不存内容·classify分类/other不记/真实送达才记/不进ALLOWED_FIELDS·reply不渲染）
        run: node scripts/proactive_opening_smoke.mjs

      - name: proactive 人设语气稳定化（P1-③：persona-derived tone guard·端着不飘温柔/混合不压暖/anxious拍平·坏版本验红）
        run: node scripts/persona_tone_guard_smoke.mjs

      - name: 自称第三人称守卫·去名字硬编码（self_third_person 按 companion.name 动态构造·非溪语角色不再漏抓/元字符转义/空名 fail-open/sanitize 同步·坏版本验红）
        run: node scripts/persona_self_third_person_smoke.mjs

      - name: 内容边界·越界应对（v1.24：他想越界/闯祸→接住不递刀不怂恿不说教·向着你问法/严重暴力临时保底/防矫枉·结构闸·坏版本验红）
        run: DB_PATH=/tmp/cb_ci.db node scripts/content_boundary_transgression_smoke.mjs

      - name: 凭空用户态（v1.25：reply+proactive 两路径通治·砍凭空断定用户即时态/习惯(手柄/喝酒)·🔴锁放行开放关心(累不累/吃了没/在干嘛)防矫枉·结构闸·坏版本验红）
        run: DB_PATH=/tmp/nf_ci.db node scripts/content_no_fabrication_smoke.mjs

      - name: 贴纸节流（v1.27：P1密度回拨3-5/D1整条至多1张+enabled出口硬闸+非法标记不外漏/D2轮次冷却/D3断棘轮·坏版本验红七闸）
        run: DB_PATH=/tmp/st_ci.db node scripts/sticker_throttle_smoke.mjs

      - name: 贴纸情境门控（v1.28·缺口②：吵架冲突态/危机轮不注入贴纸·纯函数stickerContextBlocked·双向红验+OFF字节等价+5场景/三态/危机全档/esc≥2/proactive arc-only）
        run: node scripts/sticker_context_gate_smoke.mjs

      - name: 防沉迷连续使用2h提示（法规②·计时/照片锚点保活H1/去重节奏/协调让路/运行时红线assert/fail-open/闸关inert·坏版本验红）
        run: DB_PATH=/tmp/aa_ci.db node scripts/anti_addiction_smoke.mjs

      - name: 防沉迷 gap 阈值校准脚本（确定性回测·合成库·零真实数据·停板A#1改判留档）
        run: node scripts/usage_interval_calibration_smoke.mjs

      - name: 防沉迷提示措辞常驻守卫（VARIANTS 会被改的文案→任何措辞改动机器先审词面:红线/精度/时长事实/跨度真实性·结构消除>靠人记得）
        run: node scripts/anti_addiction_preview.mjs

      - name: 即时状态锚定（P2→P1：buildPresenceAnchor 否定式硬锚·schedule override/周末/recency/merge白名单·坏版本验红）
        run: DB_PATH=/tmp/ia_ci.db node scripts/instant_state_anchor_smoke.mjs

      - name: 完整作息/日程系统（5身份作息档·个体派生不雷同·日历轴/寒暑假/节假日·🔴有限度趋同双向验红:用户熬夜钳基线±窗不跟到底/正常偏移趋同还在·存量迁移拉回窗内）
        run: DB_PATH=/tmp/ds_ci.db node scripts/daily_schedule_smoke.mjs

      - name: 主动话题开新话头（回库·分享非挽留·防打断三重门·出站反愧疚·坏版本验红）
        run: node scripts/topic_opener_smoke.mjs

      - name: topic松绑（🔴主刀每日预算·日界重置非时间·坏版本验红:进程永不重置→次日仍堵/主刀→次日能再开·fail-silent·不读沉默焊死行·取料扩面works）
        run: DB_PATH=/tmp/tl_ci.db node scripts/topic_loosen_smoke.mjs

      - name: 语义/intent 级复读止血（PR-1：intent 分类/冷却/ack 闸·守住早安续命器·存量序列红验）
        run: node scripts/intent_dedup_smoke.mjs

      - name: proactive 主动行为调度层（PR-2 降噪+矜持化：7类分类/静默闸早安豁免/想你三档drop/photo48h限频/不勒索）
