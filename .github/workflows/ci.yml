        run: DB_PATH=/tmp/b2z_ci.db node scripts/d3_batch2_compress_smoke.mjs

      - name: 批B2 条件块接线canary（停板B·D3批2：RE_IDENT_PROBE直问-AI/框架/套设定→ident_probe→IDENT_COND·PHOTO_COND索图轮复用photoIntent同源·不误伤既有intent·坏版本验红）
        run: DB_PATH=/tmp/b2c_ci.db node scripts/b2_cond_blocks_smoke.mjs

      - name: 07-15合规⑥ 人设软化拼接自检+guard（确定性·软化三句在/旧硬否认消/guard仍抓我是AI·真LLM三验另手动跑）
        run: DB_PATH=/tmp/pp_soft_ci.db node scripts/compliance_persona_softening_realllm.mjs

      - name: 情绪机 1000 轮压测 + fuzzing
        run: node scripts/emotion_stress_test.mjs

      - name: 危机干预 safety 护栏
        run: node scripts/safety_smoke.mjs

      - name: 危机检测扩词 召回↑ + benign precision 不崩（坏版本验红）
        run: node scripts/crisis_pattern_smoke.mjs

      - name: 梗词白名单谓词 isPureMemeWhitelist（停板A primitive·整串纯玩梗·坏版本验红）
        run: node scripts/meme_whitelist_smoke.mjs

      - name: 未成年人保护 minor guard 护栏
